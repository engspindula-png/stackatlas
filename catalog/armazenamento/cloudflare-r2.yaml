id: cloudflare-r2
nome: Cloudflare R2
categoria: armazenamento
subcategoria: object-storage
site: https://www.cloudflare.com/developer-platform/r2/
cadastro: https://dash.cloudflare.com/sign-up
icone: cloudflare
sinais:
  configuracao:
    - wrangler.toml
    - wrangler.jsonc
  dependencias:
    - "@aws-sdk/client-s3"
  dependenciasObsoletas: []
  variaveis:
    - R2_ACCOUNT_ID
    - R2_ACCESS_KEY_ID
    - R2_SECRET_ACCESS_KEY
    - R2_BUCKET_NAME
    - CLOUDFLARE_R2_BUCKET
  hosts:
    - "*.r2.cloudflarestorage.com"
  chaves: []
teste:
  nivel1:
    metodo: GET
    url: https://www.cloudflare.com
    dominiosPermitidos:
      - cloudflare.com
    regra: alcance_dns
alternativas:
  - amazon-s3
verificadoEm: "2026-11-06"
fontes:
  - https://developers.cloudflare.com/r2
