id: auth0
nome: Auth0
categoria: autenticacao
subcategoria: identity-provider
site: https://auth0.com
cadastro: https://auth0.com/signup
icone: auth0
sinais:
  configuracao:
    - .auth0.json
  dependencias:
    - "@auth0/nextjs-auth0"
    - "@auth0/auth0-react"
    - auth0-js
    - auth0
  dependenciasObsoletas:
    - nome: passport-auth0
      motivo: Biblioteca legada não mantida ativamente
  variaveis:
    - AUTH0_SECRET
    - AUTH0_BASE_URL
    - AUTH0_ISSUER_BASE_URL
    - AUTH0_CLIENT_ID
    - AUTH0_CLIENT_SECRET
    - AUTH0_DOMAIN
    - NEXT_PUBLIC_AUTH0_DOMAIN
  hosts:
    - "*.auth0.com"
  chaves: []
teste:
  nivel1:
    metodo: GET
    url: https://auth0.com
    dominiosPermitidos:
      - auth0.com
    regra: alcance_dns
alternativas:
  - clerk
  - supabase
verificadoEm: "2026-11-06"
fontes:
  - https://auth0.com/docs
